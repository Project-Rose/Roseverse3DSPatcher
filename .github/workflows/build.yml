name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  TARGET: Roseverse3DSPatcher
  MAKEROM_VERSION: 0.19.0
  BANNERTOOL_VERSION: 1.2.3

jobs:
  make:
    name: make (3dsx)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: make
        run: make TARGET="$TARGET"

      - name: Upload 3DSX
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TARGET }}-3dsx
          path: |
            ${{ env.TARGET }}.3dsx
            ${{ env.TARGET }}.smdh
          if-no-files-found: error

      - name: Upload CIA inputs
        uses: actions/upload-artifact@v7
        with:
          name: cia-inputs
          path: |
            ${{ env.TARGET }}.elf
            ${{ env.TARGET }}.smdh
            romfs
          if-no-files-found: error

  cia:
    name: make cia
    needs: make
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download CIA inputs
        uses: actions/download-artifact@v8
        with:
          name: cia-inputs

      - name: Install makerom and bannertool
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/3ds-tools"
          mkdir -p "$tools"
          cd "$tools"

          curl -sSfL -o makerom.zip \
            "https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v${MAKEROM_VERSION}/makerom-v${MAKEROM_VERSION}-ubuntu_x86_64.zip"
          unzip -q makerom.zip

          curl -sSfL \
            "https://github.com/carstene1ns/3ds-bannertool/releases/download/${BANNERTOOL_VERSION}/bannertool-${BANNERTOOL_VERSION}-linux.tar.gz" \
            | tar xz --strip-components=1

          chmod +x makerom bannertool
          echo "$tools" >> "$GITHUB_PATH"

      - name: make cia
        working-directory: build-cia
        run: |
          set -euo pipefail
          bannertool makebanner \
            -i ../meta/banner.png \
            -a ../meta/banner.wav \
            -o banner.bnr
          makerom -f cia -o "../$TARGET.cia" \
            -DAPP_ENCRYPTED=false \
            -rsf app.rsf \
            -target t \
            -exefslogo \
            -elf "../$TARGET.elf" \
            -icon "../$TARGET.smdh" \
            -banner banner.bnr

      - name: Upload CIA
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TARGET }}-cia
          path: ${{ env.TARGET }}.cia
          if-no-files-found: error

